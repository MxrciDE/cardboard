name: Cardboard build

on:
  push:
    branches:
      - "port/**"
  pull_request:
    branches:
      - "ver/26.2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardboard-port-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
